name: ZARA Interpreter Build Check

on:
  push:
    branches: [ main, person1-tokenizer, person2-parser, person3-evaluator, person4-testing ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Compile all Java files
      run: |
        mkdir -p bin
        find . -name "*.java" -not -path "./bin/*" > sources.txt
        cat sources.txt
        javac -d bin @sources.txt
        echo "Compilation Successful!"

    - name: Find and Run Test 1
      run: |
        ZARA_FILE=$(find . -name "test1.zara" | head -1)
        if [ -n "$ZARA_FILE" ]; then
          echo "Running $ZARA_FILE"
          java -cp bin Main "$ZARA_FILE"
        else
          echo "test1.zara not found - skipping"
        fi

    - name: Find and Run Test 2
      run: |
        ZARA_FILE=$(find . -name "test2.zara" | head -1)
        if [ -n "$ZARA_FILE" ]; then
          java -cp bin Main "$ZARA_FILE"
        else
          echo "test2.zara not found - skipping"
        fi

    - name: Find and Run Test 3
      run: |
        ZARA_FILE=$(find . -name "test3.zara" | head -1)
        if [ -n "$ZARA_FILE" ]; then
          java -cp bin Main "$ZARA_FILE"
        else
          echo "test3.zara not found - skipping"
        fi

    - name: Find and Run Test 4
      run: |
        ZARA_FILE=$(find . -name "test4.zara" | head -1)
        if [ -n "$ZARA_FILE" ]; then
          java -cp bin Main "$ZARA_FILE"
        else
          echo "test4.zara not found - skipping"
        fi
