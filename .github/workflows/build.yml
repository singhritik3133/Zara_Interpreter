name: ZARA Interpreter Build Check

on:
  push:
    branches: [ main, person1-tokenizer, person2-parser, person3-evaluator, person4-testing ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile ZARA Interpreter
      run: |
        mkdir -p bin
        javac -d bin Tokenizer/*.java parser/*.java Evaluator/*.java src/*.java 2>/dev/null || javac -d bin $(find . -name "*.java" ! -path "./bin/*")
        echo "Compilation Successful!"

    - name: Run Test 1 - Arithmetic
      run: |
        java -cp bin Main samples/test1.zara 2>/dev/null || java -cp bin Main test1.zara 2>/dev/null || echo "Test 1 skipped - file not found"

    - name: Run Test 2 - Strings
      run: |
        java -cp bin Main samples/test2.zara 2>/dev/null || java -cp bin Main test2.zara 2>/dev/null || echo "Test 2 skipped - file not found"

    - name: Run Test 3 - Conditional
      run: |
        java -cp bin Main samples/test3.zara 2>/dev/null || java -cp bin Main test3.zara 2>/dev/null || echo "Test 3 skipped - file not found"

    - name: Run Test 4 - Loop
      run: |
        java -cp bin Main samples/test4.zara 2>/dev/null || java -cp bin Main test4.zara 2>/dev/null || echo "Test 4 skipped - file not found"
